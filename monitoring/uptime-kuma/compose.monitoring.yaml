services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    expose:
      - "3001"
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD", "node", "server/server.js", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uptime-kuma-data:
